version: 2

models:
  - name: fct_orders
    description: "Заказы без тестовых"
    columns:
      - name: order_id
        description: "Номер заказа"
        data_tests: [unique, not_null]
      - name: items_count
        description: "Число разных товаров"
        data_tests: [ not_null ]
      - name: customer_id
        description: "Номер клиента"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date
      - name: ordered_at
        description: "Время оформления заказа"
      - name: order_status
        description: "Статус заказа"
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled']
      - name: order_amount
        description: "Сумма заказа после скидок"
        data_tests: [not_null, non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов"
      - name: refunded_amount
        description: "Сумма возвратов"
      - name: net_paid_amount
        description: "Оплаты минус возвраты"
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов"
      - name: first_paid_at
        description: "Время первой успешной оплаты"
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]

  - name: fct_order_items
    description: "Позиции заказов"
    columns:
      - name: order_item_id
        description: "Ключ позиции: заказ и товар"
        data_tests: [unique, not_null]
      - name: order_id
        description: "Номер заказа"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Номер товара"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Номер клиента"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата оформления заказа"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date
      - name: quantity
        description: "Количество единиц товара в позиции"
      - name: unit_price
        description: "Цена за единицу товара до скидки"
      - name: discount_amount
        description: "Сумма скидки на позицию"
      - name: line_amount
        description: "Стоимость позиции после скидки"
        data_tests: [not_null, non_negative]
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"
        data_tests: [not_null]

  - name: dim_products
    description: "Товары с категориями"
    columns:
      - name: product_id
        description: "Номер товара"
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара"
      - name: brand
        description: "Бренд"
      - name: category_id
        description: "Номер категории"
        data_tests: [not_null]
      - name: category_name
        description: "Название категории"
        data_tests: [not_null]
      - name: parent_category_id
        description: "Номер родителя, NULL у корня"
      - name: parent_category_name
        description: "Название родителя, NULL у корня"
      - name: root_category_name
        description: "Верхняя категория"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Electronics', 'Home']


  - name: dim_dates
    description: "Календарь дат заказов"
    columns:
      - name: order_date
        description: "Дата заказа"
        data_tests: [unique, not_null]
      - name: year
        description: "Год"
        data_tests: [not_null]
      - name: quarter
        description: "Квартал"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: month
        description: "Месяц"
        data_tests: [not_null]
      - name: day_of_month
        description: "День месяца"
        data_tests: [not_null]
      - name: day_of_week
        description: "День недели: пн 1, вс 7"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false
      - name: is_weekend
        description: "Суббота или воскресенье"
        data_tests: [not_null]

  - name: dim_customers
    description: "Клиенты и их покупки"
    columns:
      - name: customer_id
        description: "Номер клиента"
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Время регистрации"
      - name: registration_date
        description: "Дата регистрации"
      - name: city
        description: "Город"
      - name: acquisition_channel
        description: "Канал привлечения"
      - name: first_confirmed_order_id
        description: "Номер первой подтверждённой покупки"
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: first_confirmed_at
        description: "Время оформления первой подтверждённой покупки"
      - name: confirmed_orders_count
        description: "Число подтверждённых покупок"
        data_tests: [not_null]
      - name: confirmed_revenue
        description: "Сумма подтверждённых покупок"
        data_tests: [not_null]
      - name: is_buyer
        description: "Есть подтверждённые покупки"
        data_tests: [not_null]
